<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unity Code Graph</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <div class="stage-lines" aria-hidden="true">
        <span class="orbit orbit-a"></span>
        <span class="orbit orbit-b"></span>
        <span class="orbit orbit-c"></span>
        <span class="slash slash-a"></span>
        <span class="slash slash-b"></span>
      </div>

      <section class="hero" aria-label="Unity Code Graph launcher">
        <div class="hero-fan" aria-hidden="true"></div>
        <div class="hero-shadow" aria-hidden="true"></div>
        <div class="star star-a" aria-hidden="true"></div>
        <div class="star star-b" aria-hidden="true"></div>

        <div class="wordmark-wrap">
          <svg class="wordmark" viewBox="0 0 520 210" role="img" aria-label="Unity Code Graph">
            <path class="wordmark-orbit" d="M40 154 C148 34 334 20 484 122" />
            <path class="wordmark-orbit orbit-thin" d="M88 188 C186 82 334 54 466 84" />
            <text class="wordmark-main wordmark-top" x="18" y="86">Unity</text>
            <text class="wordmark-main wordmark-bottom" x="105" y="150">Code Graph</text>
            <text class="wordmark-sub" x="238" y="178">C# relationship scanner</text>
            <path class="wordmark-star" d="M76 93 C88 120 97 129 124 141 C97 153 88 162 76 189 C64 162 55 153 28 141 C55 129 64 120 76 93Z" />
          </svg>
        </div>

        <div class="status-strip">
          <span id="statusPill">IDLE</span>
          <strong id="statusText">Ready to generate</strong>
          <p>Scan local projects, keep watch mode alive, then jump into the canvas.</p>
        </div>
      </section>

      <section class="workspace">
        <header class="workspace-header">
          <div class="header-copy">
            <span class="kicker">System Command</span>
            <h2>Project Scanner</h2>
            <p>Choose a source, generate a graph, and keep it fresh while Unity scripts change.</p>
          </div>
          <button id="openCanvas" class="open-canvas">Open Canvas</button>
        </header>

        <div class="panel scanner-panel">
          <label>
            <span>Project Folder</span>
            <div class="field-combo">
              <input id="projectPath" placeholder="Choose a Unity project folder" />
              <button id="browse">Browse</button>
            </div>
          </label>

          <label>
            <span>Git Repository</span>
            <div class="field-combo">
              <input id="gitUrl" placeholder="https://github.com/user/repo.git" />
              <button id="clone">Clone</button>
            </div>
          </label>

          <div class="grid-two">
            <label>
              <span>Code Folders</span>
              <input id="roots" value="Scripts,Source" />
            </label>
            <label>
              <span>Output JSON</span>
              <input id="outputPath" value="code-graph.json" />
            </label>
          </div>

          <div class="actions">
            <button id="generate" class="primary">Generate Once</button>
            <button id="watch" class="success">Start Watch</button>
            <button id="stop" class="danger" disabled>Stop</button>
          </div>
        </div>

        <div class="log-panel">
          <div class="log-head">
            <span>Activity</span>
            <button id="clearLog">Clear</button>
          </div>
          <pre id="log"></pre>
        </div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
